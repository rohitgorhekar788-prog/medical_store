{% extends 'base.html' %}

{% block content %}
<div class="container py-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold"><i class="bi bi-camera me-2 text-primary"></i>AI Vision Scanner</h3>
        <span class="badge bg-success fs-6">Live Camera</span>
    </div>

    <div class="row g-4">
        <!-- Video Feed Section -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-3 text-center">
                <div class="position-relative bg-dark rounded overflow-hidden" style="min-height: 320px;">
                    <video id="webcam" autoplay playsinline class="w-100 h-100" style="object-fit: cover;"></video>
                    <canvas id="canvas" class="d-none"></canvas>
                </div>
                <div class="mt-3">
                    <button id="startBtn" class="btn btn-outline-primary fw-bold me-2" onclick="startCamera()">
                        <i class="bi bi-play-circle me-1"></i> Start Camera
                    </button>
                    <button id="captureBtn" class="btn btn-primary fw-bold" onclick="captureAndScan()" disabled>
                        <i class="bi bi-camera-fill me-1"></i> Capture & Scan
                    </button>
                    <label class="btn btn-outline-success fw-bold ms-2 mb-0">
                        <i class="bi bi-image me-1"></i> Upload Medicine Image
                        <input type="file" accept="image/*" hidden onchange="uploadAndScan(event)">
                    </label>
                </div>
                <div id="camError" class="alert alert-danger text-start small mt-3 d-none mb-0"></div>
            </div>
        </div>

        <!-- Scan Result & Stock Management Section -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-3">
                <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-search me-2"></i>Recognition Result</h5>
                
                <div id="loading" class="text-center py-4 d-none">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted small">Scanning medicine via AI...</p>
                </div>

                <div id="resultCard" class="d-none">
                    <div class="alert alert-success border-0 shadow-sm mb-3">
                        <input type="hidden" id="resMedId">
                        <h5 class="fw-bold mb-1 text-dark" id="resName">Medicine Name</h5>
                        <p class="mb-2 text-muted small" id="resGeneric">Generic Name</p>
                        <hr>
                        <div class="d-flex justify-content-between mb-1">
                            <span>Category:</span> <strong id="resCat">--</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span>Price:</span> <strong class="text-success" id="resPrice">₹0.00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span>Available Stock:</span> <strong class="text-primary" id="resStock">0 units</strong>
                        </div>
                    </div>

                    <!-- Quantity Input & Stock Deduct Section -->
                    <div class="card bg-light border-0 p-3 rounded">
                        <form id="deductForm" onsubmit="updateStock(event)">
                            <div class="mb-3">
                                <label for="qtyToDeduct" class="form-label fw-bold small text-dark">Quantity Issued to Customer:</label>
                                <input type="number" id="qtyToDeduct" class="form-control form-control-lg" min="1" value="1" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">
                                <i class="bi bi-check-circle-fill me-1"></i> Sell & Update Database
                            </button>
                        </form>
                    </div>
                </div>

                <div id="noResult" class="text-center text-muted py-5">
                    <i class="bi bi-upc-scan fs-1 text-secondary"></i>
                    <p class="mt-2 small">Start camera and click "Capture & Scan" to recognize medicine.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let video = document.getElementById('webcam');
    let canvas = document.getElementById('canvas');
    let captureBtn = document.getElementById('captureBtn');
    let camError = document.getElementById('camError');

    async function startCamera() {
        camError.classList.add('d-none');
        camError.innerHTML = '';

        if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            camError.innerHTML = "<strong>Camera unavailable on this address.</strong><br>" +
                "Open <strong>http://127.0.0.1:5000/scanner</strong> on this computer for camera access. If you are using another device/IP, use <strong>Upload Medicine Image</strong>.";
            camError.classList.remove('d-none');
            return;
        }

        try {
            let stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "environment" } 
            });
            video.srcObject = stream;
            captureBtn.disabled = false;
        } catch (err) {
            camError.innerText = "Camera Permission Error: " + err.message;
            camError.classList.remove('d-none');
        }
    }

    function captureAndScan() {
        let context = canvas.getContext('2d');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        let imageData = canvas.toDataURL('image/jpeg');

        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('resultCard').classList.add('d-none');
        document.getElementById('noResult').classList.add('d-none');

        fetch("{{ url_for('scanner') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imageData })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('loading').classList.add('d-none');
            if (data.success) {
                document.getElementById('resMedId').value = data.id || data.medicine_id;
                document.getElementById('resName').innerText = data.name;
                document.getElementById('resGeneric').innerText = data.generic_name || "Generic";
                document.getElementById('resCat').innerText = data.category;
                document.getElementById('resPrice').innerText = "₹" + parseFloat(data.price).toFixed(2);
                document.getElementById('resStock').innerText = data.stock + " units";
                document.getElementById('qtyToDeduct').max = data.stock;
                document.getElementById('qtyToDeduct').value = 1;
                document.getElementById('resultCard').classList.remove('d-none');
            } else {
                alert(data.message || "Medicine not recognized!");
                document.getElementById('noResult').classList.remove('d-none');
            }
        })
        .catch(err => {
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('noResult').classList.add('d-none');
            alert("Error processing scanner image: " + err);
        });
    }

    function uploadAndScan(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) { sendImageForScan(e.target.result); };
        reader.readAsDataURL(file);
    }

    function sendImageForScan(imageData) {
        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('resultCard').classList.add('d-none');
        document.getElementById('noResult').classList.add('d-none');
        fetch("{{ url_for('scanner') }}", {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({image:imageData})})
        .then(res => res.json())
        .then(data => {
            document.getElementById('loading').classList.add('d-none');
            if (!data.success) { document.getElementById('noResult').classList.remove('d-none'); alert(data.message || 'Medicine not recognized.'); return; }
            document.getElementById('resMedId').value=data.id; document.getElementById('resName').innerText=data.name;
            document.getElementById('resGeneric').innerText=data.generic_name||'Generic'; document.getElementById('resCat').innerText=data.category||'General';
            document.getElementById('resPrice').innerText='₹'+Number(data.price||0).toFixed(2); document.getElementById('resStock').innerText=(data.stock||0)+' units';
            document.getElementById('qtyToDeduct').max=data.stock||0; document.getElementById('resultCard').classList.remove('d-none');
        }).catch(err => { document.getElementById('loading').classList.add('d-none'); alert('Scanner error: '+err.message); });
    }

    function updateStock(e) {
        if (e) e.preventDefault();

        let medId = document.getElementById('resMedId').value;
        let qty = parseInt(document.getElementById('qtyToDeduct').value);

        if (!medId) {
            alert("Please scan a medicine first!");
            return;
        }

        fetch("/api/deduct-stock", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ medicine_id: medId, quantity: qty })
        })
        .then(async res => {
            const contentType = res.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const text = await res.text();
                throw new Error("Server returned non-JSON response. Session might have expired.");
            }
            return res.json();
        })
        .then(data => {
            if (data.success) {
                alert("Stock updated successfully! Remaining Stock: " + data.new_stock + " units");
                
                // इथे थेट स्क्रीनवरील स्टॉक अपडेट होईल, पेज रिडायरेक्ट होणार नाही
                document.getElementById('resStock').innerText = data.new_stock + " units";
                document.getElementById('qtyToDeduct').max = data.new_stock;
                document.getElementById('qtyToDeduct').value = 1;
            } else {
                alert("Error: " + data.message);
            }
        })
        .catch(err => {
            console.error("Update Stock Error:", err);
            alert("Failed to update stock: " + err.message);
        });
    }
</script>
{% endblock %}
